[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrawatch-agent"
version = "0.1.0"
description = "InfraWatch lightweight monitoring agent"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["psutil>=5.9", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
infrawatch-agent = "infrawatch_agent.cli:main"

[tool.setuptools.packages.find]
include = ["infrawatch_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
