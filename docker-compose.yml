# InfraWatch: server + TimescaleDB (+ optional TLS reverse proxy).
#   cp .env.example .env   # then edit the secrets
#   docker compose up -d --build
#   docker compose --profile tls up -d    # adds Caddy for HTTPS on :443
services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: infrawatch
      POSTGRES_USER: infrawatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrawatch -d infrawatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      INFRAWATCH_DATABASE_URL: postgresql://infrawatch:${POSTGRES_PASSWORD}@db:5432/infrawatch
      INFRAWATCH_SECRET_KEY: ${INFRAWATCH_SECRET_KEY:?set INFRAWATCH_SECRET_KEY in .env}
      INFRAWATCH_ADMIN_PASSWORD: ${INFRAWATCH_ADMIN_PASSWORD:?set INFRAWATCH_ADMIN_PASSWORD in .env}
      INFRAWATCH_TRUST_PROXY_HEADERS: ${INFRAWATCH_TRUST_PROXY_HEADERS:-false}
    ports: ["8000:8000"]   # plain HTTP: bind to 127.0.0.1 or use the tls profile in production
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    profiles: [tls]
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    ports: ["443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
