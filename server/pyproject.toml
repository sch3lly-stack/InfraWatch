[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrawatch-server"
version = "0.1.0"
description = "InfraWatch central monitoring server"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout"]

[tool.setuptools.packages.find]
include = ["infrawatch_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
